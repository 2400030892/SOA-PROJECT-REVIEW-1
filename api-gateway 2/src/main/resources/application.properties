spring.application.name=api-gateway

server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# ==============================
# Doctor Service Route
# ==============================

spring.cloud.gateway.server.webmvc.routes[0].id=doctor-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://DOCTOR-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/doctors/**


# ==============================
# Appointment Service Route
# ==============================

spring.cloud.gateway.server.webmvc.routes[1].id=appointment-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://APPOINTMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/appointments/**


# ==============================
# Billing Service Route
# ==============================

spring.cloud.gateway.server.webmvc.routes[2].id=billing-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://BILLING-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/bills/**